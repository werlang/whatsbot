<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{{metaTitle}}</title>
    <meta name="description" content="{{metaDescription}}">
    <link rel="canonical" href="{{webUrl}}{{canonicalPath}}">
    <link rel="icon" href="/img/mark.svg" type="image/svg+xml">
    <link rel="preload" href="/fonts/martian-mono-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/source-sans-3-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/gateway.css?v={{assetVersion}}">
    <script type="module" src="/js/root.js?v={{assetVersion}}"></script>
</head>

<body class="gateway">
    <main class="gateway__panel" aria-labelledby="gateway-title">
        <div class="gateway__brand">
            <img src="/img/mark.svg" alt="" width="28" height="28">
            <span>{{siteName}}</span>
        </div>

        <h1 class="gateway__title" id="gateway-title">Opening...</h1>

        <div class="gateway__track" aria-hidden="true">
            <span class="gateway__sweep"></span>
        </div>

        <div class="gateway__meta">
            <span>Checking browser session</span>
            <a class="button button--quiet button--sm" href="/login">Open login</a>
        </div>

        <noscript>
            <div class="gateway__noscript">
                <p>JavaScript is required to open a saved session automatically.</p>
                <a class="button button--primary button--sm" href="/login">Go to login</a>
            </div>
        </noscript>
    </main>
    {{{template-vars}}}
</body>

</html>
